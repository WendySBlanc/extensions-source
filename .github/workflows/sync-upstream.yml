name: Sync Keiyoushi source

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-keiyoushi-source
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'WendySBlanc/extensions-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/keiyoushi/extensions-source.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Source is already up to date."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
